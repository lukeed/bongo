name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'archive/**'
      - 'docs/**'
      - 'example/**'
      - 'demo123/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'archive/**'
      - 'docs/**'
      - 'example/**'
      - 'demo123/**'
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bun ${{ matrix.bun }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bun: [latest]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install
        run: bun install

      - name: Compiles
        run: bun run build

      - name: Test
        run: bun test

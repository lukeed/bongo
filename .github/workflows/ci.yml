name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'archive/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'archive/**'
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bun ${{ matrix.bun }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bun: ['1.4.0', latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install
        run: bun install

      - name: Compiles
        run: bun run build

      - name: Test
        run: bun test

      - name: (example) build
        run: bun example build

      - name: (example) smoke test
        run: |
          if [ ! -f example/public/index.html ]; then
            echo "::error::example/public/index.html missing — build did not produce expected output"
            exit 1
          fi
          if grep -rq "__BONGO_BUNDLE" example/public/; then
            echo "::error::unresolved placeholder tokens in example/public/"
            grep -rn "__BONGO_BUNDLE" example/public/
            exit 1
          fi
          pages=$(find example/public -name '*.html' | wc -l | tr -d ' ')
          echo "Example built cleanly: $pages HTML pages emitted."

      - name: (docs) build
        run: bun docs build

      - name: (docs) smoke test
        run: |
          if grep -rq "__BONGO_BUNDLE" docs/public/; then
            echo "::error::unresolved placeholder tokens in docs/public/"
            grep -rn "__BONGO_BUNDLE" docs/public/
            exit 1
          fi
          pages=$(find docs/public -name '*.html' | wc -l | tr -d ' ')
          echo "Docs built cleanly: $pages HTML pages emitted."

  deploy:
    name: deploy docs
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Compiles
        run: bun run build

      - name: (docs) build
        run: bun docs build

      - name: (docs) deploy
        run: bun docs deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # https://docs.npmjs.com/trusted-publishers
  publish:
    name: publish to npm
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # -> the GitHub release
      id-token: write # -> npm trusted publishing, with provenance
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: bun install

      - name: Compiles
        run: bun run build

      - name: Check versions
        run: |
          for dir in packages/bongo packages/plugin.markdown packages/plugin.feed packages/create-bongo; do
            version=$(jq -r .version $dir/package.json)
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::$dir is v$version, but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
          if [ ! -f "docs/content/releases/$GITHUB_REF_NAME.md" ]; then
            echo "::error::docs/content/releases/$GITHUB_REF_NAME.md is missing; write the release notes there"
            exit 1
          fi

      - name: 'Publish → npm'
        run: |
          tag=latest
          if [[ "$GITHUB_REF_NAME" == *-next.* ]]; then tag=next; fi
          for dir in packages/bongo packages/plugin.markdown packages/plugin.feed packages/create-bongo; do
            (cd $dir && npm publish --provenance --access public --tag $tag)
          done

      # The notes are the release page of the docs, without its frontmatter, with links to the docs site.
      - name: GitHub release
        run: |
          awk 'n >= 2 { print } /^---$/ && n < 2 { n++ }' "docs/content/releases/$GITHUB_REF_NAME.md" \
            | sed -E 's#\]\(/#](https://bongo.build/#g' > notes.md
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-next.* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}

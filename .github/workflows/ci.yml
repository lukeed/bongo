name: CI

on:
  push:
    paths-ignore:
      - 'example/**'
      - 'demo123/**'
      - '*.md'
    branches:
      - 'bun'
    tags-ignore:
      - '**'
  # pull_request:
  #   paths-ignore:
  #     - 'example/**'
  #     - 'demo123/**'
  #     - '*.md'
  #   branches:
  #     - main

jobs:
  bun:
    name: Bun
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: oven-sh/setup-bun@v1
      with:
        bun-version: "0.7.1"

    - name: Install
      run: bun install


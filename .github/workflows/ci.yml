name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'archive/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'archive/**'
      - '*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bun ${{ matrix.bun }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bun: [latest]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install
        run: bun install

      - name: Compiles
        run: bun run build

      - name: Test
        run: bun test

      - name: (example) build
        run: bun example build

      - name: (example) smoke test
        run: |
          if [ ! -f example/public/index.html ]; then
            echo "::error::example/public/index.html missing — build did not produce expected output"
            exit 1
          fi
          if grep -rq "__BONGO_BUNDLE" example/public/; then
            echo "::error::unresolved placeholder tokens in example/public/"
            grep -rn "__BONGO_BUNDLE" example/public/
            exit 1
          fi
          pages=$(find example/public -name '*.html' | wc -l | tr -d ' ')
          echo "Example built cleanly: $pages HTML pages emitted."

      - name: (docs) build
        run: bun docs build

      - name: (docs) smoke test
        run: |
          if grep -rq "__BONGO_BUNDLE" docs/public/; then
            echo "::error::unresolved placeholder tokens in docs/public/"
            grep -rn "__BONGO_BUNDLE" docs/public/
            exit 1
          fi
          pages=$(find docs/public -name '*.html' | wc -l | tr -d ' ')
          echo "Docs built cleanly: $pages HTML pages emitted."

  deploy:
    name: deploy docs
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install

      - name: Compiles
        run: bun run build

      - name: (docs) build
        run: bun docs build

      - name: (docs) deploy
        run: bun docs deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

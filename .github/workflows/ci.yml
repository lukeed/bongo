name: CI

on:
  push:
    paths-ignore:
      - 'example/**'
      - 'demo123/**'
      - '*.md'
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
    paths-ignore:
      - 'example/**'
      - 'demo123/**'
      - '*.md'
    branches:
      - master

jobs:
  test:
    name: Node.js v${{ matrix.nodejs }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nodejs: [22]
    steps:
    - uses: actions/checkout@v6
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.10
    - uses: pnpm/action-setup@v4
      with:
        version: 10.x
        run_install: false
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.nodejs }}

    - name: Install
      run: pnpm install

    - name: Compiles
      run: pnpm run build

    - name: Test
      run: bun test

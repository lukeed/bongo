name: CI

on:
  push:
    paths-ignore:
      - 'example/**'
      - 'demo123/**'
      - '*.md'
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
    paths-ignore:
      - 'example/**'
      - 'demo123/**'
      - '*.md'
    branches:
      - master

jobs:
  test:
    name: Node.js v${{ matrix.nodejs }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nodejs: [22]
    steps:
    - uses: actions/checkout@v6
    - uses: pnpm/action-setup@v4
      with:
        version: 10.x
        run_install: false
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.nodejs }}

    - name: Install
      run: pnpm install

    # - name: (coverage) Install
    #   if: matrix.nodejs >= 14
    #   run: pnpm add -g c8

    - name: Compiles
      run: pnpm run build

    # - name: Test
    #   if: matrix.nodejs < 14
    #   run: pnpm test

